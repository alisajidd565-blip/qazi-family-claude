// ===== DB FUNCTIONS =====
async function dbFetchSubmissions(){
  const{data,error}=await sb.from("qazi_submissions").select("*").order("created_at",{ascending:true});
  if(error)throw error; return data||[];
}
async function dbFetchChallenges(){
  const{data,error}=await sb.from("qazi_challenges").select("*").order("created_at",{ascending:true});
  if(error)throw error; return data||[];
}
async function dbFetchIntros(){
  const{data,error}=await sb.from("qazi_intros").select("*");
  if(error)throw error;
  const map={};(data||[]).forEach(r=>{map[r.cousin_id]=r.intro;});return map;
}
async function dbInsertSubmission(row){
  const{data,error}=await sb.from("qazi_submissions").insert(row).select().single();
  if(error)throw error; return data;
}
async function dbInsertChallenge(row){
  const{data,error}=await sb.from("qazi_challenges").insert(row).select().single();
  if(error)throw error; return data;
}
async function dbUpsertIntro(cousin_id,intro){
  const{error}=await sb.from("qazi_intros").upsert({cousin_id,intro,updated_at:new Date().toISOString()});
  if(error)throw error;
}
async function dbDeleteSubmission(id){
  const{error}=await sb.from("qazi_submissions").delete().eq("id",id);
  if(error)throw error;
}

// ===== CLOUDINARY UPLOAD =====
async function uploadToCloudinary(file){
  const fd=new FormData();
  fd.append("file",file);
  fd.append("upload_preset",CFG.cloudinaryPreset);
  fd.append("folder","qazi-league");
  const resp=await fetch("https://api.cloudinary.com/v1_1/"+CFG.cloudinaryCloud+"/image/upload",{method:"POST",body:fd});
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||"Cloudinary upload failed");}
  const data=await resp.json();
  return data.secure_url;
}

// ===== GROQ AI JUDGE =====
async function callGroqJudge(base64Data,mimeType,challengePrompt,refB64,refMime){
  const hasRef=refB64&&refMime;
  const refNote=hasRef?`
A REFERENCE IMAGE has been provided above (first image). It is purely a rough visual mood-board uploaded by the organiser — a loose atmospheric hint only.
CRITICAL: Do NOT score or penalise based on similarity/deviation from the reference image. The reference carries ZERO weight in your scoring. It is shown only so you understand the general theme, nothing more.`:"";

  const prompt = `You are a fair and encouraging AI judge for the "AI Enthusiasts - Qazi Family" image competition.

TASK the participant was given: "${challengePrompt}"

You are now looking at the PARTICIPANT'S submitted image${hasRef ? " (second image)" : ""}.

JUDGING CRITERIA — score each out of 10:
1. visual_score        — Overall visual quality, aesthetics, composition, detail, and artistic polish.
2. task_score          — How well the image follows and fulfills the given TASK prompt.

SCORING RULES:
- Be fair, generous, and constructive.
- overall_score = (visual_score × 0.6) + (task_score × 0.4). Round to 1 decimal place.

Reply ONLY with valid JSON, no extra text:
{
  "visual_score": <1-10>,
  "task_score": <1-10>,
  "overall_score": <1-10>,
  "review": "<2-3 sentence review>",
  "improvements": "<2-3 specific improvement tips>",
  "roast": "<short funny roast>"
}`;
  
  const contentArr=[];
  if(hasRef){
    contentArr.push({type:"image_url",image_url:{url:"data:"+refMime+";base64,"+refB64}});
  }
  contentArr.push({type:"image_url",image_url:{url:"data:"+mimeType+";base64,"+base64Data}});
  contentArr.push({type:"text",text:prompt});

  const resp=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Authorization":"Bearer "+CFG.groqKey,"Content-Type":"application/json"},
    body:JSON.stringify({model:"meta-llama/llama-4-scout-17b-16e-instruct",messages:[{role:"user",content:contentArr}],max_tokens:900,temperature:0.7})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||"Groq error "+resp.status);}
  const data=await resp.json();
  return JSON.parse((data.choices?.[0]?.message?.content||"").replace(/```json|```/g,"").trim());
}

            <div key={c.id} style={{order:po[i],textAlign:"center",minWidth:"125px"}}>
              <img src={c.img} alt={c.name} loading="lazy" style={{width:i===0?"80px":"66px",height:i===0?"80px":"66px",borderRadius:"50%",objectFit:"cover",border:"3px solid "+mc[i],boxShadow:"0 0 20px "+mc[i]+"55",marginBottom:"8px"}}/>
              <div style={{fontSize:"24px"}}>{md2[i]}</div>
              <div style={{color:mc[i],fontFamily:OF,fontSize:"12px",fontWeight:"700",marginBottom:"4px"}}>{c.name.split(" ")[0]}</div>
              <div style={{background:mc[i]+"22",border:"1px solid "+mc[i]+"44",borderRadius:"12px",height:ph[i],display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"flex-start",paddingTop:"16px"}}>
                <div style={{fontSize:"24px",fontWeight:"900",color:mc[i],fontFamily:OF}}>{c.total}</div>
                <div style={{fontSize:"10px",color:C.muted,letterSpacing:"1px"}}>POINTS</div>
                <div style={{fontSize:"11px",color:C.muted,marginTop:"4px"}}>{c.count} games</div>
              </div>
            </div>
          );
        })}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:"9px"}}>
        {deferredLb.map((c,i)=>(
          <div key={c.id} style={{...CARD,padding:"14px 18px",display:"flex",alignItems:"center",gap:"14px",border:"1px solid "+(i<3?c.color+"44":"rgba(0,229,255,0.15)")}}>
            <div style={{width:"36px",height:"36px",borderRadius:"50%",background:i===0?"rgba(245,158,11,0.15)":i===1?"rgba(100,116,139,0.15)":"rgba(255,255,255,0.05)",display:"flex",alignItems:"center",justifyContent:"center",fontFamily:OF,fontSize:i<3?"16px":"12px",color:i===0?C.gold:i===1?C.muted:i===2?"#cd7f32":C.muted,flexShrink:0}}>{medal(i+1)}</div>
            <img src={c.img} alt={c.name} loading="lazy" style={{width:"40px",height:"40px",borderRadius:"50%",objectFit:"cover",border:"2px solid "+c.color+"66",flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{fontWeight:"700",color:c.color,fontFamily:OF,fontSize:"13px"}}>{c.name}</div>
              <div style={{fontSize:"11px",color:C.muted}}>{c.count} submission{c.count!==1?"s":""} · avg {c.avg}</div>
            </div>
            <div style={{textAlign:"right"}}>
              <div style={{fontSize:"21px",fontWeight:"900",color:C.cyan,fontFamily:OF}}>{c.total}</div>
              <div style={{fontSize:"9px",color:C.muted}}>PTS</div>
            </div>
          </div>
        ))}
      </div>
    </div>}

    {tab==="hof"&&<div style={{padding:"36px 20px 80px",maxWidth:"880px",margin:"0 auto"}}>
      <h2 style={{fontFamily:OF,color:C.cyan,textShadow:"0 0 16px "+C.cyan,fontSize:"24px",textAlign:"center",marginBottom:"32px",letterSpacing:"4px"}}>⭐ HALL OF FAME</h2>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(240px,1fr))",gap:"20px",marginBottom:"36px"}}>
        {[
          {title:"BEST SUBMISSION",icon:"🏅",color:C.gold,content:bestSub?(<div><img src={bestSub.image_url} alt="" loading="lazy" style={{width:"100%",borderRadius:"8px",marginBottom:"10px",maxHeight:"170px",objectFit:"cover",cursor:"pointer"}} onClick={()=>setViewSub(bestSub)}/><div style={{color:C.gold,fontFamily:OF,fontSize:"20px",textAlign:"center",fontWeight:"900"}}>{bestSub.overall_score}/10</div><div style={{color:C.muted,fontSize:"12px",textAlign:"center"}}>by {getCousin(bestSub.cousin_id)?.name}</div></div>):<p style={{color:C.muted,textAlign:"center",fontSize:"13px",padding:"20px 0"}}>No submissions yet!</p>},
          {title:"FUNNIEST ROAST",icon:"😂",color:C.purple,content:funniest?(<div style={{textAlign:"center"}}><img src={getCousin(funniest.cousin_id)?.img} alt="" loading="lazy" style={{width:"58px",height:"58px",borderRadius:"50%",objectFit:"cover",border:"2px solid "+C.purple+"66",marginBottom:"10px"}}/><p style={{color:"#c4b5fd",fontSize:"13px",fontStyle:"italic",lineHeight:"1.65"}}>"{funniest.roast}"</p><div style={{color:C.muted,fontSize:"11px"}}>— AI Judge, roasting {getCousin(funniest.cousin_id)?.name}</div></div>):<p style={{color:C.muted,textAlign:"center",fontSize:"13px",padding:"20px 0"}}>AI waiting to roast someone!</p>},
          {title:"MOST ACTIVE",icon:"🔥",color:C.green,content:mostActive&&mostActive.count>0?(<div style={{textAlign:"center"}}><img src={mostActive.img} alt="" loading="lazy" style={{width:"72px",height:"72px",borderRadius:"50%",objectFit:"cover",border:"2px solid "+C.green+"66",marginBottom:"10px",boxShadow:"0 0 18px "+C.green+"44"}}/><div style={{color:C.green,fontFamily:OF,fontSize:"15px",fontWeight:"700"}}>{mostActive.name}</div><div style={{color:C.muted,fontSize:"12px",marginTop:"4px"}}>{mostActive.count} submissions 💪</div></div>):<p style={{color:C.muted,textAlign:"center",fontSize:"13px",padding:"20px 0"}}>Start competing!</p>},
        ].map(({title,icon,color,content})=>(
          <div key={title} style={{...CARD,padding:"22px",border:"1px solid "+color+"44"}}>
            <div style={{fontSize:"36px",textAlign:"center",marginBottom:"10px"}}>{icon}</div>
            <h3 style={{fontFamily:OF,color,textAlign:"center",margin:"0 0 14px",fontSize:"12px",letterSpacing:"2px"}}>{title}</h3>
            {content}
          </div>
        ))}
      </div>
      <div style={{...CARD,padding:"22px",border:"1px solid rgba(0,229,255,0.15)"}}>
        <h3 style={{fontFamily:OF,color:C.cyan,margin:"0 0 16px",fontSize:"13px",letterSpacing:"2px"}}>📋 CHALLENGE HISTORY</h3>
        <div style={{display:"flex",flexDirection:"column",gap:"9px"}}>
          {[...challenges].reverse().map((c,i)=>(
            <div key={c.id||i} style={{background:"rgba(255,255,255,0.03)",borderRadius:"8px",padding:"11px 14px",border:"1px solid "+diffColor(c.difficulty)+"22"}}>
              <div style={{display:"flex",justifyContent:"space-between",marginBottom:"5px"}}>
                <span style={{fontSize:"10px",color:diffColor(c.difficulty),fontFamily:OF,letterSpacing:"1px"}}>{c.difficulty}</span>
                <span style={{fontSize:"10px",color:C.muted}}>📅 {new Date(c.created_at||Date.now()).toLocaleDateString()}</span>
              </div>
              <p style={{margin:0,fontSize:"13px",color:"#e2e8f0",fontStyle:"italic"}}>"{c.prompt}"</p>
              <div style={{fontSize:"10px",color:C.muted,marginTop:"5px"}}>{subs.filter(s=>s.challenge_id===c.id).length} submission(s)</div>
            </div>
          ))}
        </div>
      </div>
    </div>}

    <footer style={{borderTop:"1px solid rgba(0,229,255,0.12)",padding:"24px 20px",textAlign:"center",color:C.muted,fontSize:"12px"}}>
      <div style={{fontFamily:OF,color:C.cyan,textShadow:"0 0 12px "+C.cyan,fontSize:"13px",marginBottom:"5px"}}>AI ENTHUSIASTS — QAZI FAMILY 🤖</div>
      <div>Powered by Groq AI + Supabase + Cloudinary • Real-time leaderboard</div>
      {adminMode&&<div style={{color:C.gold,marginTop:"5px",fontFamily:OF,fontSize:"10px"}}>⚡ ADMIN MODE ACTIVE</div>}
    </footer>
  </div>

  {/* MODALS */}
  {showLogin&&<div style={MOD} onClick={e=>e.target===e.currentTarget&&(setShowLogin(false),setPass(""))}>
    <div style={{...MBX,maxWidth:"360px"}} className="modal-anim">
      <div style={{textAlign:"center",fontSize:"38px",marginBottom:"10px"}}>🔐</div>
      <h3 style={{fontFamily:OF,color:C.cyan,textShadow:"0 0 12px "+C.cyan,textAlign:"center",marginBottom:"20px",fontSize:"17px",letterSpacing:"3px"}}>ADMIN ACCESS</h3>
      <input type="password" placeholder="Enter admin password..." value={pass} onChange={e=>setPass(e.target.value)} onKeyDown={e=>e.key==="Enter"&&handleLogin()} style={INP}/>
      <div style={{display:"flex",gap:"10px"}}>
        <button className="pb" onClick={handleLogin} style={{...PBTN,flex:1}}>LOGIN</button>
        <button onClick={()=>{setShowLogin(false);setPass("");}} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.15)",color:"#94a3b8",borderRadius:"8px",padding:"11px 18px",cursor:"pointer",flex:1}}>CANCEL</button>
      </div>
    </div>
  </div>}

  {uploadFor&&<div style={MOD} onClick={e=>e.target===e.currentTarget&&closeUpload()}>
    <div style={MBX} className="modal-anim">
      {(()=>{const c=getCousin(uploadFor);return(<>
        <div style={{display:"flex",alignItems:"center",gap:"14px",marginBottom:"16px"}}>
          <img src={c?.img} alt="" loading="lazy" style={{width:"50px",height:"50px",borderRadius:"50%",objectFit:"cover",border:"2px solid "+c?.color+"66"}}/>
          <div>
            <h3 style={{fontFamily:OF,color:c?.color,margin:0,fontSize:"15px"}}>Upload for {c?.name}</h3>
            <p style={{color:C.muted,fontSize:"11px",margin:"4px 0 0"}}>"{chall.prompt.slice(0,70)}..."</p>
          </div>
        </div>
        {chall.reference_image_url&&(
          <div style={{marginBottom:"16px",borderRadius:"10px",overflow:"hidden",border:"1px solid rgba(245,158,11,0.3)",background:"rgba(245,158,11,0.04)"}}>
            <div style={{padding:"6px 12px",fontSize:"9px",color:C.gold,fontFamily:OF,letterSpacing:"2px",display:"flex",alignItems:"center",gap:"5px",borderBottom:"1px solid rgba(245,158,11,0.2)"}}>
              🖼️ REFERENCE IMAGE <span style={{color:C.muted,fontFamily:"'Exo 2',sans-serif",letterSpacing:"0",fontSize:"9px",fontWeight:"400",textTransform:"none"}}>— rough inspiration only, NOT a strict target</span>
            </div>
            <img src={chall.reference_image_url} alt="Reference" style={{width:"100%",maxHeight:"140px",objectFit:"cover",display:"block"}} loading="lazy"/>
          </div>
        )}
        {!preview?(<div className="up-zone" onClick={()=>fileRef.current?.click()} style={{marginBottom:"16px"}}>
          <div style={{fontSize:"40px",marginBottom:"8px"}}>📤</div>
          <div style={{color:C.cyan,fontFamily:OF,fontSize:"12px",marginBottom:"5px"}}>CLICK TO UPLOAD IMAGE</div>
          <div style={{color:C.muted,fontSize:"11px"}}>PNG, JPG, JPEG, WEBP</div>
          <input ref={fileRef} type="file" accept="image/*" onChange={handleFile} style={{display:"none"}}/>
        </div>):(<div style={{marginBottom:"16px"}}>
          <img src={preview} alt="Preview" style={{width:"100%",maxHeight:"240px",objectFit:"contain",borderRadius:"10px",border:"1px solid rgba(0,229,255,0.25)"}}/>
          <button onClick={()=>{setPrev(null);setRF(null);}} style={{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.4)",color:C.red,borderRadius:"7px",padding:"7px 14px",cursor:"pointer",marginTop:"8px",width:"100%"}}>✕ Remove</button>
        </div>)}
        {statusMsg&&<div style={{background:"rgba(0,229,255,0.08)",border:"1px solid rgba(0,229,255,0.25)",borderRadius:"8px",padding:"10px 14px",marginBottom:"12px",fontSize:"12px",color:C.cyan,display:"flex",alignItems:"center",gap:"8px"}}>
          <span className="spinner"/>
          {statusMsg}
        </div>}
        {judgeErr&&<div style={{background:"rgba(239,68,68,0.1)",border:"1px solid rgba(239,68,68,0.4)",borderRadius:"8px",padding:"10px 14px",marginBottom:"12px",fontSize:"12px",color:C.red}}>{judgeErr}</div>}
        <div style={{display:"flex",gap:"10px"}}>
          <button className="pb" onClick={submitAndJudge} disabled={!preview||uploading||judging} style={{...PBTN,flex:1,opacity:!preview||uploading||judging?0.45:1,cursor:!preview||uploading||judging?"not-allowed":"pointer"}}>
            {uploading?"📤 UPLOADING...":(judging?"🤖 JUDGING...":"⚡ SUBMIT & JUDGE")}
          </button>
          <button onClick={closeUpload} disabled={uploading||judging} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.15)",color:"#94a3b8",borderRadius:"8px",padding:"11px 16px",cursor:"pointer",opacity:uploading||judging?0.5:1}}>CANCEL</button>
        </div>
      </>);})()}
    </div>
  </div>}

  {viewSub&&<div style={MOD} onClick={e=>e.target===e.currentTarget&&setViewSub(null)}>
    <div style={MBX} className="modal-anim">
      {(()=>{const s=viewSub;const c=getCousin(s.cousin_id);const sc=s.overall_score>=8?C.green:s.overall_score>=6?C.gold:C.red;return(<>
        <div style={{textAlign:"center",marginBottom:"20px"}}>
          <div style={{fontSize:"40px",marginBottom:"6px"}}>🤖</div>
          <h3 style={{fontFamily:OF,color:C.cyan,margin:"0 0 3px",fontSize:"17px",letterSpacing:"3px"}}>AI VERDICT</h3>
          <div style={{color:C.muted,fontSize:"12px"}}>for {c?.name}</div>
        </div>
        <img src={s.image_url} alt="" style={{width:"100%",maxHeight:"200px",objectFit:"cover",borderRadius:"10px",marginBottom:"16px",border:"1px solid "+sc+"44"}}/>
        <div style={{textAlign:"center",marginBottom:"20px"}}>
          <div style={{fontSize:"54px",fontWeight:"900",color:sc,fontFamily:OF,textShadow:"0 0 25px "+sc}}>{s.overall_score}<span style={{fontSize:"20px",color:C.muted}}>/10</span></div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"8px",marginBottom:"16px"}}>
  {[
    ["🎨 Visual Quality", s.visual_score, C.purple],
    ["🎯 Task Adherence", s.task_score, C.cyan]
  ].map(([lbl,val,col])=>(
    <div key={lbl} style={{...CARD,padding:"10px",textAlign:"center",border:"1px solid "+col+"33"}}>
      <div style={{color:col,fontSize:"17px",fontWeight:"700",fontFamily:OF}}>{val}</div>
      <div style={{fontSize:"9px",color:C.muted,marginTop:"3px"}}>{lbl}</div>
    </div>
  ))}
</div>
        {[["📋 REVIEW",s.review,C.cyan,"rgba(0,229,255,0.06)"],["💡 IMPROVE",s.improvements,C.gold,"rgba(245,158,11,0.06)"],["😂 ROAST",s.roast,C.purple,"rgba(168,85,247,0.06)"]].map(([lbl,txt,col,bg])=>(
          <div key={lbl} style={{background:bg,borderRadius:"10px",padding:"12px 14px",marginBottom:"10px",border:"1px solid "+col+"22"}}>
            <div style={{fontSize:"9px",color:col,letterSpacing:"2px",marginBottom:"6px",fontFamily:OF}}>{lbl}</div>
            <p style={{color:"#e2e8f0",fontSize:"12px",lineHeight:"1.7",margin:0,fontStyle:"italic"}}>"{txt}"</p>
          </div>
        ))}
        <div style={{display:"flex",gap:"10px",marginTop:"6px"}}>
          <button className="pb" onClick={()=>setViewSub(null)} style={{...PBTN,flex:1}}>CLOSE</button>
          {adminMode&&<button onClick={()=>deleteSubmission(s.id)} style={{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.4)",color:C.red,borderRadius:"8px",padding:"11px 16px",cursor:"pointer"}}>🗑️ Delete</button>}
        </div>
      </>);})()}
    </div>
  </div>}

  {gallery&&<div style={MOD} onClick={e=>e.target===e.currentTarget&&setGallery(null)}>
    <div style={{...MBX,maxWidth:"740px"}} className="modal-anim">
      {(()=>{const c=getCousin(gallery);const cs=subsByCousin[gallery]||[];return(<>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:"20px"}}>
          <div style={{display:"flex",alignItems:"center",gap:"12px"}}>
            <img src={c?.img} alt="" loading="lazy" style={{width:"44px",height:"44px",borderRadius:"50%",objectFit:"cover",border:"2px solid "+c?.color+"66"}}/>
            <div><h3 style={{fontFamily:OF,color:c?.color,margin:0,fontSize:"14px"}}>{c?.name}</h3><div style={{color:C.muted,fontSize:"11px"}}>{cs.length} submissions</div></div>
          </div>
          <button onClick={()=>setGallery(null)} style={{background:"rgba(239,68,68,0.15)",border:"1px solid rgba(239,68,68,0.4)",color:C.red,borderRadius:"7px",padding:"6px 12px",cursor:"pointer"}}>✕ Close</button>
        </div>
        {cs.length===0?<p style={{color:C.muted,textAlign:"center",padding:"40px"}}>No submissions yet!</p>:(
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:"12px"}}>
            {[...cs].reverse().map(sub=>(
              <div key={sub.id} style={{...CARD,overflow:"hidden",cursor:"pointer",border:"1px solid "+c?.color+"33"}} onClick={()=>setViewSub(sub)}>
                <img src={sub.image_url} alt="" loading="lazy" style={{width:"100%",height:"120px",objectFit:"cover"}}/>
                <div style={{padding:"9px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
                  <span style={{fontSize:"10px",color:C.muted}}>{new Date(sub.created_at).toLocaleDateString()}</span>
                  <span style={{color:C.gold,fontFamily:OF,fontSize:"13px",fontWeight:"700"}}>{sub.overall_score}/10</span>
                </div>
              </div>
            ))}
          </div>
        )}
      </>);})()}
    </div>
  </div>}

  {showCE&&<div style={MOD} onClick={e=>e.target===e.currentTarget&&(setSCE(false),setNRI(null),setNRF(null))}>
    <div style={{...MBX,maxWidth:"500px"}} className="modal-anim">
      <h3 style={{fontFamily:OF,color:C.cyan,textShadow:"0 0 12px "+C.cyan,textAlign:"center",marginBottom:"20px",fontSize:"16px",letterSpacing:"2px"}}>➕ NEW CHALLENGE</h3>
      <textarea placeholder="Enter challenge prompt..." value={newPrompt} onChange={e=>setNP(e.target.value)} style={{...INP,minHeight:"100px",resize:"vertical",marginBottom:"14px"}}/>
      <div style={{marginBottom:"16px"}}>
        <div style={{fontSize:"11px",color:C.muted,marginBottom:"7px"}}>DIFFICULTY</div>
        <div style={{display:"flex",gap:"7px"}}>
          {["Easy","Medium","Hard","Extreme"].map(d=>(
            <button key={d} onClick={()=>setND(d)} style={{background:newDiff===d?diffColor(d)+"22":"transparent",border:"1px solid "+(newDiff===d?diffColor(d)+"66":"rgba(255,255,255,0.1)"),color:newDiff===d?diffColor(d):C.muted,borderRadius:"7px",padding:"6px",cursor:"pointer",flex:1,fontSize:"11px"}}>{d}</button>
          ))}
        </div>
      </div>
      <div style={{marginBottom:"16px"}}>
        <div style={{fontSize:"11px",color:C.muted,marginBottom:"7px",display:"flex",alignItems:"center",gap:"6px"}}>
          <span style={{color:C.gold}}>🖼️</span> REFERENCE IMAGE <span style={{color:"rgba(100,116,139,0.6)",fontFamily:"'Exo 2',sans-serif",letterSpacing:"0",fontSize:"10px",fontWeight:"400"}}>(optional — rough inspiration only)</span>
        </div>
        {!newRefImg?(
          <div onClick={()=>refImgRef.current?.click()} style={{border:"1px dashed rgba(245,158,11,0.35)",borderRadius:"10px",padding:"18px",textAlign:"center",cursor:"pointer",background:"rgba(245,158,11,0.04)",transition:"border-color .2s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor="rgba(245,158,11,0.65)"}
            onMouseLeave={e=>e.currentTarget.style.borderColor="rgba(245,158,11,0.35)"}>
            <div style={{fontSize:"26px",marginBottom:"5px"}}>🖼️</div>
            <div style={{color:C.gold,fontSize:"11px",fontFamily:OF,letterSpacing:"1px"}}>UPLOAD REFERENCE IMAGE</div>
            <div style={{color:C.muted,fontSize:"10px",marginTop:"3px"}}>Optional • PNG, JPG, WEBP</div>
            <input ref={refImgRef} type="file" accept="image/*" onChange={e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=ev=>{setNRI(ev.target.result);setNRF(f);};r.readAsDataURL(f);e.target.value="";}} style={{display:"none"}}/>
          </div>
        ):(
          <div style={{position:"relative",borderRadius:"10px",overflow:"hidden",border:"1px solid rgba(245,158,11,0.4)"}}>
            <img src={newRefImg} alt="Reference preview" style={{width:"100%",maxHeight:"160px",objectFit:"cover",display:"block"}}/>
            <button onClick={()=>{setNRI(null);setNRF(null);}} style={{position:"absolute",top:"7px",right:"7px",background:"rgba(0,0,0,0.75)",border:"1px solid rgba(239,68,68,0.6)",color:C.red,borderRadius:"6px",padding:"3px 9px",cursor:"pointer",fontSize:"11px"}}>✕ Remove</button>
            <div style={{padding:"7px 10px",background:"rgba(0,0,0,0.6)",fontSize:"10px",color:"rgba(245,158,11,0.8)",fontStyle:"italic"}}>
              🖼️ {newRefFile?.name} — will be shown as a loose visual hint to participants
            </div>
          </div>
        )}
      </div>
      <div style={{display:"flex",gap:"10px"}}>
        <button className="pb" onClick={addChallenge} style={{...PBTN,flex:1}}>ADD CHALLENGE</button>
        <button onClick={()=>{setSCE(false);setNRI(null);setNRF(null);}} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.15)",color:"#94a3b8",borderRadius:"8px",padding:"11px 16px",cursor:"pointer"}}>CANCEL</button>
      </div>
    </div>
  </div>}

  {editIntroId&&<div style={MOD} onClick={e=>e.target===e.currentTarget&&setEI(null)}>
    <div style={{...MBX,maxWidth:"420px"}} className="modal-anim">
      <h3 style={{fontFamily:OF,color:C.cyan,textShadow:"0 0 12px "+C.cyan,textAlign:"center",marginBottom:"16px",fontSize:"15px",letterSpacing:"2px"}}>✏️ EDIT INTRO</h3>
      <div style={{color:C.muted,fontSize:"12px",marginBottom:"9px"}}>Editing: {getCousin(editIntroId)?.name}</div>
      <textarea value={editTxt} onChange={e=>setET(e.target.value)} style={{...INP,minHeight:"88px",resize:"vertical",marginBottom:"14px"}}/>
      <div style={{display:"flex",gap:"10px"}}>
        <button className="pb" onClick={saveIntro} style={{...PBTN,flex:1}}>SAVE</button>
        <button onClick={()=>setEI(null)} style={{background:"rgba(255,255,255,0.05)",border:"1px solid rgba(255,255,255,0.15)",color:"#94a3b8",borderRadius:"8px",padding:"11px 16px",cursor:"pointer"}}>CANCEL</button>
      </div>
    </div>
  </div>}

</div>
  );
}
const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(React.createElement(App));
</script>
</body>
</html>
