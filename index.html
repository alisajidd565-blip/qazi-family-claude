// ===== DB FUNCTIONS =====
async function dbFetchSubmissions(){
  const{data,error}=await sb.from("qazi_submissions").select("*").order("created_at",{ascending:true});
  if(error)throw error; return data||[];
}
async function dbFetchChallenges(){
  const{data,error}=await sb.from("qazi_challenges").select("*").order("created_at",{ascending:true});
  if(error)throw error; return data||[];
}
async function dbFetchIntros(){
  const{data,error}=await sb.from("qazi_intros").select("*");
  if(error)throw error;
  const map={};(data||[]).forEach(r=>{map[r.cousin_id]=r.intro;});return map;
}
async function dbInsertSubmission(row){
  const{data,error}=await sb.from("qazi_submissions").insert(row).select().single();
  if(error)throw error; return data;
}
async function dbInsertChallenge(row){
  const{data,error}=await sb.from("qazi_challenges").insert(row).select().single();
  if(error)throw error; return data;
}
async function dbUpsertIntro(cousin_id,intro){
  const{error}=await sb.from("qazi_intros").upsert({cousin_id,intro,updated_at:new Date().toISOString()});
  if(error)throw error;
}
async function dbDeleteSubmission(id){
  const{error}=await sb.from("qazi_submissions").delete().eq("id",id);
  if(error)throw error;
}

// ===== CLOUDINARY UPLOAD =====
async function uploadToCloudinary(file){
  const fd=new FormData();
  fd.append("file",file);
  fd.append("upload_preset",CFG.cloudinaryPreset);
  fd.append("folder","qazi-league");
  const resp=await fetch("https://api.cloudinary.com/v1_1/"+CFG.cloudinaryCloud+"/image/upload",{method:"POST",body:fd});
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||"Cloudinary upload failed");}
  const data=await resp.json();
  return data.secure_url;
}

// ===== GROQ AI JUDGE =====
async function callGroqJudge(base64Data,mimeType,challengePrompt){
  const prompt=`You are an AI judge for the "AI Enthusiasts - Qazi Family" competition.

Challenge: "${challengePrompt}"

Analyze this AI-generated image vs the challenge prompt. Reply ONLY with valid JSON:
{"creativity_score":<1-10>,"adherence_score":<1-10>,"artistic_quality_score":<1-10>,"overall_score":<1-10>,"review":"<2-3 sentence review>","improvements":"<2-3 improvement tips>","roast":"<funny roast>"}

overall_score=average of 3 scores. JSON only.`;
  const resp=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Authorization":"Bearer "+CFG.groqKey,"Content-Type":"application/json"},
    body:JSON.stringify({model:"meta-llama/llama-4-scout-17b-16e-instruct",messages:[{role:"user",content:[{type:"image_url",image_url:{url:"data:"+mimeType+";base64,"+base64Data}},{type:"text",text:prompt}]}],max_tokens:800,temperature:0.7})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||"Groq error "+resp.status);}
  const data=await resp.json();
  return JSON.parse((data.choices?.[0]?.message?.content||"").replace(/```json|```/g,"").trim());
}

// ===== MAIN APP =====
function App(){
  const[subs,setSubs]=useState([]);
  const[challenges,setChalls]=useState([DEFAULT_CHALL]);
  const[intros,setIntros]=useState({});
  const[loading,setLoading]=useState(true);
  const[adminMode,setAdmin]=useState(false);
  const[showLogin,setShowLogin]=useState(false);
  const[pass,setPass]=useState("");
  const[tab,setTab]=useState("home");
  const[gallery,setGallery]=useState(null);
  const[viewSub,setViewSub]=useState(null);
  const[uploadFor,setUF]=useState(null);
  const[preview,setPrev]=useState(null);
  const[rawFile,setRF]=useState(null);
  const[uploading,setUploading]=useState(false);
  const[judging,setJudging]=useState(false);
  const[statusMsg,setStatus]=useState("");
  const[judgeErr,setJE]=useState("");
  const[notif,setNotif]=useState(null);
  const[newPrompt,setNP]=useState("");
  const[newDiff,setND]=useState("Medium");
  const[showCE,setSCE]=useState(false);
  const[editIntroId,setEI]=useState(null);
  const[editTxt,setET]=useState("");
  const fileRef=useRef(null);
  const ntRef=useRef(null);

  const chall=challenges[challenges.length-1];

  // ===== LOAD DATA =====
  useEffect(()=>{
    const init=async()=>{
      try{
        const[s,c,i]=await Promise.all([dbFetchSubmissions(),dbFetchChallenges(),dbFetchIntros()]);
        setSubs(s);
        if(c.length>0)setChalls(c); else setChalls([DEFAULT_CHALL]);
        setIntros(i);
      }catch(e){toast("DB load error: "+e.message,"err");}
      setLoading(false);
    };
    init();

    // Real-time subscription
    const ch=sb.channel("qazi_rt")
      .on("postgres_changes",{event:"*",schema:"public",table:"qazi_submissions"},()=>{dbFetchSubmissions().then(setSubs).catch(()=>{});})
      .on("postgres_changes",{event:"*",schema:"public",table:"qazi_challenges"},()=>{dbFetchChallenges().then(d=>{if(d.length>0)setChalls(d);}).catch(()=>{});})
      .on("postgres_changes",{event:"*",schema:"public",table:"qazi_intros"},()=>{dbFetchIntros().then(setIntros).catch(()=>{});})
      .subscribe();

    return()=>sb.removeChannel(ch);
  },[]);

  // ===== MEMOIZED COMPUTATIONS =====
  const lb=useMemo(()=>COUSINS.map(c=>{
    const cs=subs.filter(s=>s.cousin_id===c.id);
    const total=cs.reduce((a,s)=>a+(s.overall_score||0),0);
    return{...c,total,count:cs.length,avg:cs.length?+(total/cs.length).toFixed(1):0};
  }).sort((a,b)=>b.total-a.total),[subs]);

  const subsByCousin=useMemo(()=>{
    const m={};COUSINS.forEach(c=>{m[c.id]=subs.filter(s=>s.cousin_id===c.id);});return m;
  },[subs]);

  const totalPts=useMemo(()=>subs.reduce((a,s)=>a+(s.overall_score||0),0),[subs]);
  const bestSub=useMemo(()=>subs.length?subs.reduce((b,s)=>(s.overall_score||0)>(b.overall_score||0)?s:b,subs[0]):null,[subs]);
  const funniest=useMemo(()=>subs.filter(s=>s.roast).sort((a,b)=>b.roast.length-a.roast.length)[0]||null,[subs]);
  const mostActive=useMemo(()=>[...lb].sort((a,b)=>b.count-a.count)[0],[lb]);

  const toast=useCallback((msg,type="ok")=>{
    setNotif({msg,type});clearTimeout(ntRef.current);
    ntRef.current=setTimeout(()=>setNotif(null),4000);
  },[]);

  const closeUpload=useCallback(()=>{setUF(null);setPrev(null);setRF(null);setJE("");setStatus("");},[]);

  const handleFile=useCallback(e=>{
    const f=e.target.files[0];if(!f)return;
    const r=new FileReader();
    r.onload=ev=>{setRF(f);setPrev(ev.target.result);setJE("");};
    r.readAsDataURL(f);
    e.target.value="";
  },[]);

  const submitAndJudge=useCallback(async()=>{
    if(!preview||!rawFile||!uploadFor)return;
    setUploading(true);setJE("");setStatus("📤 Uploading to Cloudinary...");
    let imageUrl;
    try{
      imageUrl=await uploadToCloudinary(rawFile);
      setStatus("🤖 Groq AI is judging...");
    }catch(e){setJE("Upload failed: "+e.message);setUploading(false);setStatus("");return;}
    
    setJudging(true);setUploading(false);
    try{
      const b64=preview.split(",")[1];
      const result=await callGroqJudge(b64,rawFile.type,chall.prompt);
      const row={
        cousin_id:uploadFor,
        challenge_id:chall.id||null,
        challenge_prompt:chall.prompt,
        image_url:imageUrl,
        creativity_score:result.creativity_score,
        adherence_score:result.adherence_score,
        artistic_quality_score:result.artistic_quality_score,
        overall_score:result.overall_score,
        review:result.review,
        improvements:result.improvements,
        roast:result.roast,
      };
      const saved=await dbInsertSubmission(row);
      setViewSub(saved);
      closeUpload();
      toast("Judged! Score: "+result.overall_score+"/10 ⚡");
    }catch(e){setJE("Error: "+e.message);toast("Judging failed","err");}
    setJudging(false);setStatus("");
  },[preview,rawFile,uploadFor,chall,closeUpload,toast]);

    else{setUF(id);setPrev(null);setRF(null);setJE("");setStatus("");}
  },[intros]);

  if(loading)return(
    <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",flexDirection:"column",gap:"20px"}}>
      <div style={{fontSize:"60px",animation:"float 2s ease-in-out infinite",willChange:"transform"}}>🤖</div>
      <div style={{fontFamily:OF,color:C.cyan,textShadow:"0 0 20px "+C.cyan,fontSize:"18px",letterSpacing:"3px"}}>LOADING...</div>
      <div style={{color:C.muted,fontSize:"13px"}}>Connecting to Supabase...</div>
    </div>

async function callGroqJudge(base64Data,mimeType,challengePrompt){
  const prompt=`You are an AI judge for the "AI Enthusiasts - Qazi Family" competition.

Challenge: "${challengePrompt}"

Analyze this AI-generated image vs the challenge prompt. Reply ONLY with valid JSON:
{"creativity_score":<1-10>,"adherence_score":<1-10>,"artistic_quality_score":<1-10>,"overall_score":<1-10>,"review":"<2-3 sentence review>","improvements":"<2-3 improvement tips>","roast":"<funny roast>"}

overall_score=average of 3 scores. JSON only.`;
  const resp=await fetch("https://api.groq.com/openai/v1/chat/completions",{
    method:"POST",
    headers:{"Authorization":"Bearer "+CFG.groqKey,"Content-Type":"application/json"},
    body:JSON.stringify({model:"meta-llama/llama-4-scout-17b-16e-instruct",messages:[{role:"user",content:[{type:"image_url",image_url:{url:"data:"+mimeType+";base64,"+base64Data}},{type:"text",text:prompt}]}],max_tokens:800,temperature:0.7})
  });
  if(!resp.ok){const e=await resp.json();throw new Error(e.error?.message||"Groq error "+resp.status);}
  const data=await resp.json();
  return JSON.parse((data.choices?.[0]?.message?.content||"").replace(/```json|```/g,"").trim());
}
